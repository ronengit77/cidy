kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_debug_conversationStartEntry
      conditions:
        - id: conditionItem_debug_conversationStartEntry
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_conversationStartEntry
              activity: "DEBUG - Conversation Start entered. Conversation ID: {System.Conversation.Id}"

    - kind: SendActivity
      id: sendActivity_XSPG5a
      displayName: Welcome Message
      activity: |-
        Hello, {System.User.FirstName}!

        **I'm Cidy (beta version), the UN DESA Capacity Development Assistant.**

        My current knowledge areas include DA project planning/design and evaluation guidance; RPTC guidance and reports; Programme Development guidance, TAG meetings, Steering Committee materials, project evaluations, implementing partners and grants, Resident Coordinator country engagement, DESA capacity-development strategy, recommendations, and lessons learned; and general CDPMO knowledge. See the [Cidy knowledge map](https://ronengit77.github.io/cidy/documentation/cidy_response_topic_map.html).

        I'll answer your questions using official documents and share source links and a confidence level for each response.

        If I'm not confident that an answer is fully supported by available guidance, I'll let you know and help escalate your question to the appropriate team.

        Ready to start chatting - type your inquiry below.
        A good prompt will mention which funding stream and topic area your question is regarding (e.g., DA, RPTC, PDF/UNPDF, Programme Development, or general AND reporting, evaluation, governance, project design, TAG meetings, etc.)
        Example prompt: *"When is a final evaluation required for a Development Account project?"*

        You can say **"exit Cidy flow"** to continue in a more open conversation, and **"return to Cidy flow"** to come back to the controlled guidance path.

    - kind: SetVariable
      id: set_cidyMode_structured_start
      variable: Global.cidyMode
      value: structured

    - kind: SetVariable
      id: reset_userQuestion_start
      variable: Global.userQuestion
      value: =Blank()

    - kind: SetVariable
      id: reset_transcript_start
      variable: Global.transcript
      value: =Blank()

    - kind: SetVariable
      id: reset_intentJson_start
      variable: Global.intentJson
      value: "{}"

    - kind: SetVariable
      id: reset_intentReason_start
      variable: Global.intentReason
      value: =Blank()

    - kind: SetVariable
      id: reset_questionEnhancements_start
      variable: Global.executiveQuestionEnhancements
      value: =Blank()

    - kind: SetVariable
      id: reset_sourceUseInstructions_start
      variable: Global.sourceUseInstructions
      value: =Blank()

    - kind: SetVariable
      id: reset_countryDataEnhancedQuestion_start
      variable: Global.countryDataEnhancedQuestion
      value: =Blank()

    - kind: SetVariable
      id: reset_nextActionContext_start
      variable: Global.nextActionContext
      value: =Blank()

    - kind: SetVariable
      id: reset_awaitingNewQuestion_start
      variable: Global.awaitingNewQuestion
      value: =false

    - kind: SetVariable
      id: reset_intentStatus_start
      variable: Global.intentStatus
      value: needs_classification

    - kind: SetVariable
      id: reset_knowledgeDomain_start
      variable: Global.knowledgeDomain
      value: unclear

    - kind: SetVariable
      id: reset_fundingStream_start
      variable: Global.fundingStream
      value: UNCLEAR

    - kind: SetVariable
      id: reset_topicArea_start
      variable: Global.topicArea
      value: unclear

    - kind: SetVariable
      id: reset_requiresClarification_start
      variable: Global.requiresClarification
      value: No

    - kind: SetVariable
      id: reset_clarificationType_start
      variable: Global.clarificationType
      value: none

    - kind: SetVariable
      id: reset_clarificationQuestion_start
      variable: Global.clarificationQuestion
      value: =Blank()

    - kind: SetVariable
      id: reset_clarificationAnswer_start
      variable: Global.clarificationAnswer
      value: =Blank()

    - kind: SetVariable
      id: reset_normalizedClarificationAnswer_start
      variable: Global.normalizedClarificationAnswer
      value: =Blank()

    - kind: SetVariable
      id: reset_clarificationAttempts_start
      variable: Global.clarificationAttempts
      value: 0

    - kind: SetVariable
      id: reset_routingTarget_start
      variable: Global.routingTarget
      value: =Blank()

    - kind: SetVariable
      id: reset_draftResponse_start
      variable: Global.draftResponse
      value: =Blank()

    - kind: SetVariable
      id: reset_formattedAnswer_start
      variable: Global.formattedAnswer
      value: =Blank()

    - kind: SetVariable
      id: reset_formattedSources_start
      variable: Global.formattedSources
      value: =Blank()

    - kind: SetVariable
      id: reset_confidenceScore_start
      variable: Global.confidenceScore
      value: =Blank()

    - kind: SetVariable
      id: reset_confidenceLabel_start
      variable: Global.confidenceLabel
      value: =Blank()

    - kind: SetVariable
      id: reset_confidenceExplanation_start
      variable: Global.confidenceExplanation
      value: =Blank()

    - kind: SetVariable
      id: reset_warningMessage_start
      variable: Global.warningMessage
      value: =Blank()

    - kind: SetVariable
      id: reset_issueSummary_start
      variable: Global.issueSummary
      value: =Blank()

    - kind: SetVariable
      id: reset_userFeedback_start
      variable: Global.userFeedback
      value: =Blank()

    - kind: SetVariable
      id: reset_askAnother_start
      variable: Global.askAnother
      value: =Blank()

    - kind: SetVariable
      id: reset_retryMode_start
      variable: Global.retryMode
      value: =Blank()

    - kind: SetVariable
      id: setVariable_bGQ2Qa
      variable: Topic.conversationID
      value: =System.Conversation.Id

    - kind: ConditionGroup
      id: conditionGroup_debug_conversationStartBeforeQuestion
      conditions:
        - id: conditionItem_debug_conversationStartBeforeQuestion
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_conversationStartBeforeQuestion
              activity: DEBUG - Conversation Start is prompting for controlled intake question.

    - kind: Question
      id: question_startInput
      interruptionPolicy:
        allowInterruption: true

      variable: Global.userQuestion
      prompt: "**Please describe what you are looking for:**"
      entity:
        kind: StringPrebuiltEntity
        sensitivityLevel: None

    - kind: ConditionGroup
      id: conditionGroup_exitCommand_startInput
      conditions:
        - id: conditionItem_exitCommand_startInput
          condition: =Or(Find("exit cidy flow", Lower(Global.userQuestion)) > 0, Find("exit cindy flow", Lower(Global.userQuestion)) > 0, Find("exit structured cidy flow", Lower(Global.userQuestion)) > 0, Find("exit structured cindy flow", Lower(Global.userQuestion)) > 0, Find("leave cidy flow", Lower(Global.userQuestion)) > 0, Find("leave cindy flow", Lower(Global.userQuestion)) > 0, Find("leave structured flow", Lower(Global.userQuestion)) > 0, Find("stop cidy flow", Lower(Global.userQuestion)) > 0, Find("stop cindy flow", Lower(Global.userQuestion)) > 0, Find("leave controlled flow", Lower(Global.userQuestion)) > 0, Find("exit controlled flow", Lower(Global.userQuestion)) > 0, Find("switch to open chat", Lower(Global.userQuestion)) > 0, Find("open conversation", Lower(Global.userQuestion)) > 0, Find("switch to open conversation", Lower(Global.userQuestion)) > 0)
          actions:
            - kind: SetVariable
              id: set_cidyMode_open_startInput
              variable: Global.cidyMode
              value: open

            - kind: SetVariable
              id: clear_userQuestion_exit_startInput
              variable: Global.userQuestion
              value: =Blank()

            - kind: SendActivity
              id: msg_exitCidyFlow_startInput
              activity: |-
                You are now outside the structured Cidy flow. I can continue in a more open conversation, but I will still use approved Cidy knowledge where relevant.

                You can say **"return to Cidy flow"** at any time to go back to the structured guidance path.

            - kind: EndDialog
              id: end_exitCommand_startInput

    - kind: SetVariable
      id: initialize_transcript
      variable: Global.transcript
      value: ="TRANSCRIPT" & Char(13) & Char(10) & Char(13) & Char(10)

    - kind: SetVariable
      id: log_startQuestion
      variable: Global.transcript
      value: "=Global.transcript & \"USER: \" & Global.userQuestion & Char(13) & Char(10) & Char(13) & Char(10)"

    - kind: ConditionGroup
      id: conditionGroup_debug_conversationStartCaptured
      conditions:
        - id: conditionItem_debug_conversationStartCaptured
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_conversationStartCaptured
              activity: "DEBUG - Conversation Start captured question and is routing to Intent. Global.userQuestion: {Global.userQuestion}"

    - kind: BeginDialog
      id: goToIntentFromStart
      dialog: copilots_header_3141e.topic.Intent_c8W
