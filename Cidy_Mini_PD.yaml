kind: AdaptiveDialog
modelDescription: EXPERIMENTAL - Cidy Mini PD entry topic. Shows the one-time welcome, asks 'What would you like to know?', handles the in-chat 'debug on'/'debug off' toggle, then hands the captured question to Cidy_Mini_PD_Process for searching/answering. This topic never calls itself - it only ever BeginDialogs forward into Cidy_Mini_PD_Process (cross-topic), which avoids the InfiniteLoopInBotContent execution-cycle error that a self-targeting BeginDialog triggers in Copilot Studio. Set Global.debugMode = true (type 'debug on' in chat) to see DEBUG trace messages.
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_debugModeDefault
      conditions:
        - id: conditionItem_debugModeDefault
          condition: =IsBlank(Global.debugMode)
          actions:
            - kind: SetVariable
              id: setVariable_debugModeDefault
              variable: Global.debugMode
              value: false

    - kind: SetVariable
      id: setVariable_orchestratorModeFromInput
      variable: Global.orchestratorMode
      value: =Coalesce(Topic.orchestratorMode, false)

    - kind: ConditionGroup
      id: conditionGroup_debug_entry
      conditions:
        - id: conditionItem_debug_entry
          condition: =Global.debugMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_entry
              activity: "DEBUG - Cidy_Mini_PD (ask) entered. sessionStarted: {Global.sessionStarted} | followUpDepth: {Global.followUpDepth} | incoming activity text: {System.Activity.Text}"

    - kind: ConditionGroup
      id: conditionGroup_firstRun
      conditions:
        - id: conditionItem_firstRun
          condition: =IsBlank(Global.sessionStarted)
          actions:
            - kind: SendActivity
              id: sendActivity_welcome
              activity: |-
                Hello, {System.User.FirstName}!

                **I'm Cidy Mini**, an experimental single-knowledge-base version of Cidy.

                Ask me anything and I'll answer from the Knowledge base, with sources and a confidence level for each response.

            - kind: SetVariable
              id: setVariable_sessionStarted
              variable: Global.sessionStarted
              value: =true

            - kind: SetVariable
              id: setVariable_initTranscript
              variable: Global.transcript
              value: ="TRANSCRIPT" & Char(13) & Char(10) & Char(13) & Char(10)

    - kind: Question
      id: question_userQuestion
      alwaysPrompt: true
      interruptionPolicy:
        allowInterruption: true

      variable: Global.userQuestion
      prompt: "**What would you like to know?**"
      entity:
        kind: StringPrebuiltEntity
        sensitivityLevel: None

    - kind: SetVariable
      id: log_userQuestion
      variable: Global.transcript
      value: "=Global.transcript & \"USER: \" & Global.userQuestion & Char(13) & Char(10) & Char(13) & Char(10)"

    - kind: ConditionGroup
      id: conditionGroup_debugToggle
      conditions:
        - id: conditionItem_debugOn
          condition: =Or(Lower(Global.userQuestion) = "debug on", Lower(Global.userQuestion) = "enable debug mode")
          actions:
            - kind: SetVariable
              id: setVariable_debugOn
              variable: Global.debugMode
              value: true

            - kind: SendActivity
              id: sendActivity_debugOn
              activity: Debug mode is now ON. You'll see DEBUG trace messages at each step.

            - kind: Question
              id: question_userQuestion_postDebugOn
              alwaysPrompt: true
              interruptionPolicy:
                allowInterruption: true

              variable: Global.userQuestion
              prompt: "**What would you like to know?**"
              entity:
                kind: StringPrebuiltEntity
                sensitivityLevel: None

            - kind: SetVariable
              id: log_userQuestion_postDebugOn
              variable: Global.transcript
              value: "=Global.transcript & \"USER: \" & Global.userQuestion & Char(13) & Char(10) & Char(13) & Char(10)"

        - id: conditionItem_debugOff
          condition: =Or(Lower(Global.userQuestion) = "debug off", Lower(Global.userQuestion) = "disable debug mode")
          actions:
            - kind: SetVariable
              id: setVariable_debugOff
              variable: Global.debugMode
              value: false

            - kind: SendActivity
              id: sendActivity_debugOff
              activity: Debug mode is now OFF.

            - kind: Question
              id: question_userQuestion_postDebugOff
              alwaysPrompt: true
              interruptionPolicy:
                allowInterruption: true

              variable: Global.userQuestion
              prompt: "**What would you like to know?**"
              entity:
                kind: StringPrebuiltEntity
                sensitivityLevel: None

            - kind: SetVariable
              id: log_userQuestion_postDebugOff
              variable: Global.transcript
              value: "=Global.transcript & \"USER: \" & Global.userQuestion & Char(13) & Char(10) & Char(13) & Char(10)"

    - kind: ConditionGroup
      id: conditionGroup_menuLabelLeak
      conditions:
        - id: conditionItem_menuLabelLeak
          condition: =Or(Lower(Global.userQuestion) = "ask a follow-up question", Lower(Global.userQuestion) = "ask a new question", Lower(Global.userQuestion) = "escalate to a human", Lower(Global.userQuestion) = "restart conversation", Lower(Global.userQuestion) = "development account (da)", Lower(Global.userQuestion) = "rptc", Lower(Global.userQuestion) = "programme development (pd)", Lower(Global.userQuestion) = "unsure / general")
          actions:
            - kind: ConditionGroup
              id: conditionGroup_debug_menuLabelLeak
              conditions:
                - id: conditionItem_debug_menuLabelLeak
                  condition: =Global.debugMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_menuLabelLeak
                      activity: DEBUG - Captured text matched a menu-button label ({Global.userQuestion}), not a real question. Re-prompting instead of searching.

            - kind: Question
              id: question_userQuestion_postMenuLabelLeak
              alwaysPrompt: true
              interruptionPolicy:
                allowInterruption: true

              variable: Global.userQuestion
              prompt: "**What would you like to know?**"
              entity:
                kind: StringPrebuiltEntity
                sensitivityLevel: None

            - kind: SetVariable
              id: log_userQuestion_postMenuLabelLeak
              variable: Global.transcript
              value: "=Global.transcript & \"USER: \" & Global.userQuestion & Char(13) & Char(10) & Char(13) & Char(10)"

    - kind: ConditionGroup
      id: conditionGroup_debug_userQuestion
      conditions:
        - id: conditionItem_debug_userQuestion
          condition: =Global.debugMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_userQuestion
              activity: "DEBUG - Captured question: {Global.userQuestion} | followUpDepth: {Global.followUpDepth}/20 | thread summary going into search: {Global.followUpSummary}"

    - kind: BeginDialog
      id: OzvzV7
      dialog: eva_CidyMiniPD.topic.Cidy-Mini-PD-Process

inputType:
  properties:
    orchestratorMode:
      title: orchestratorMode
      type: boolean

outputType: {}