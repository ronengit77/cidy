kind: AdaptiveDialog
modelDescription: Cidy Mini RPTC processing topic. Reached only via BeginDialog from Cidy_Mini_RPTC. Takes Global.userQuestion, searches the RPTC knowledge source, displays the raw response (ANSWER/SOURCES/CONFIDENCE), then the post-answer menu (follow-up, new question, escalate, restart). Follow-up keeps context via a running AI summary for up to 20 rounds. Knowledge source - full RPTC file upload folder (copilots_header_3141e.topic.RPTCFileUpload_vV7zz8x3_EXkXTX80LY34). NOTE - BeginDialog references use the placeholder prefix 'cidyrptc' - update these to match the actual agent prefix assigned by Copilot Studio.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: SetVariable
      id: clear_draftResponse
      variable: Global.draftResponse
      value: =Blank()

    - kind: SearchAndSummarizeContent
      id: search_rptc
      autoSend: false
      variable: Global.draftResponse
      userInput: =Global.userQuestion
      additionalInstructions: |-
        You are Cidy RPTC, a UN DESA knowledge assistant specialising in the Regular Programme of Technical Cooperation (RPTC).
        Answer the question using ONLY the provided RPTC knowledge source.
        Conversation context, if any (use it to understand follow-up questions): {Global.followUpSummary}
        For questions about achievements, results, countries supported, requests, interventions, people supported, SIDS/LDC/LLDC support, challenges, or recommendations — draw from RPTC progress reports.
        For questions about guidelines, templates, activity proposals, activity reports, IRA recruitment, common reporting standards, planning, approval, or process — draw from RPTC guidance documents.
        If the knowledge source does not contain enough reliable information, say so.
        If the user asks for latest, most recent, current, newest, updated, or similar, prioritize the most recent dated source available. State the source date, year, report year, or version used.
        For recency-sensitive questions, reduce CONFIDENCE if the best source found is older than expected, undated, or may not reflect the current state. Use CONFIDENCE 5 only when the answer is supported by a clearly dated current/latest source; use 2-3 for older or undated latest-available sources; use 0-1 if no reliable dated source is found.
        Format your response as follows:
        ANSWER: Your detailed answer
        SOURCES: List each source as a markdown link in this exact format: [name of file](full url). The text in brackets must be the file name or document title. The text in parentheses must be the full URL only, starting with http:// or https://. Do not put titles, descriptions, dates, or file names in parentheses. Do not reverse the markdown link order. If a full URL is not available, list the source title as plain text without brackets.
        CONFIDENCE: Write ONLY a single number from 0 to 5 on this line, nothing else. No explanation, no asterisks, no additional text. Just the number.
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - copilots_header_3141e.topic.RPTCFileUpload_vV7zz8x3_EXkXTX80LY34

    - kind: ConditionGroup
      id: conditionGroup_debug_searchResult
      conditions:
        - id: conditionItem_debug_searchResult
          condition: =Global.debugMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_searchResult
              activity: "DEBUG - Query: {Global.userQuestion} | Result: {If(IsBlank(Global.draftResponse), \"BLANK\", \"HAS CONTENT\")}"

    - kind: ConditionGroup
      id: conditionGroup_blankDraft
      conditions:
        - id: conditionItem_blankDraft
          condition: =IsBlank(Global.draftResponse)
          actions:
            - kind: SendActivity
              id: sendActivity_blankResponse
              activity: I was not able to find information in the RPTC knowledge base that could answer this question.

      elseActions:
        - kind: SendActivity
          id: sendActivity_response
          activity: "{Global.draftResponse}"

    - kind: Question
      id: question_nextAction
      interruptionPolicy:
        allowInterruption: true

      variable: Topic.nextActionChoice
      prompt: What would you like to do next?
      entity:
        kind: EmbeddedEntity
        sensitivityLevel: None
        definition:
          kind: ClosedListEntity
          items:
            - id: Ask a follow-up question
              displayName: Ask a follow-up question

            - id: Ask a new question
              displayName: Ask a new question

            - id: Escalate to a human
              displayName: Escalate to a human

            - id: Restart conversation
              displayName: Restart conversation

    - kind: SetVariable
      id: set_nextAction
      variable: Global.nextAction
      value: |
        =Switch(
          Text(Topic.nextActionChoice),
          "Ask a follow-up question", "followup",
          "Ask a new question", "new",
          "Escalate to a human", "escalate",
          "Restart conversation", "restart",
          "unknown"
        )

    - kind: ConditionGroup
      id: conditionGroup_debug_nextAction
      conditions:
        - id: conditionItem_debug_nextAction
          condition: =Global.debugMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_nextAction
              activity: "DEBUG - Menu choice: {Text(Topic.nextActionChoice)} | mapped nextAction: {Global.nextAction}"

    - kind: ConditionGroup
      id: conditionGroup_nextAction
      conditions:
        - id: conditionItem_followup
          condition: =Global.nextAction = "followup"
          actions:
            - kind: SetVariable
              id: increment_followUpDepth
              variable: Global.followUpDepth
              value: =Coalesce(Global.followUpDepth, 0) + 1

            - kind: ConditionGroup
              id: conditionGroup_followUpLimit
              conditions:
                - id: conditionItem_followUpLimitReached
                  condition: =Global.followUpDepth > 20
                  actions:
                    - kind: SendActivity
                      id: sendActivity_followUpLimitReached
                      activity: You've reached the 20-follow-up limit for this thread. Let's start with a new question.

                    - kind: SetVariable
                      id: reset_followUpDepth_limitReached
                      variable: Global.followUpDepth
                      value: 0

                    - kind: SetVariable
                      id: reset_followUpSummary_limitReached
                      variable: Global.followUpSummary
                      value: =Blank()

                    - kind: SetVariable
                      id: clear_userQuestion_limitReached
                      variable: Global.userQuestion
                      value: =Blank()

                    - kind: BeginDialog
                      id: goToAsk_followUpLimitReached
                      dialog: cidyrptc.topic.Cidy_Mini_RPTC

              elseActions:
                - kind: ConditionGroup
                  id: conditionGroup_debug_followup
                  conditions:
                    - id: conditionItem_debug_followup
                      condition: =Global.debugMode = true
                      actions:
                        - kind: SendActivity
                          id: sendActivity_debug_followup
                          activity: "DEBUG - Follow-up branch. Depth: {Global.followUpDepth}/20 | Summary before update: {Global.followUpSummary}"

                - kind: AnswerQuestionWithAI
                  id: summarize_followUpThread
                  autoSend: false
                  variable: Global.followUpSummary
                  userInput: |
                    ="Existing thread summary (if any): " & Coalesce(Global.followUpSummary, "None.") & Char(13) & Char(10) & "Latest question: " & Global.userQuestion & Char(13) & Char(10) & "Latest answer: " & Global.draftResponse
                  additionalInstructions: |-
                    You are maintaining a running summary of a follow-up question thread for the Cidy RPTC knowledge agent so it can keep context across multiple follow-up turns.
                    Combine the existing thread summary (if any) with the latest question and answer into a single updated summary.
                    Keep it concise: 3-5 sentences maximum, focused on the topic and key facts already established that the next follow-up question might refer back to.
                    Do not include source links or confidence levels. Output ONLY the updated summary text, nothing else.
                  input: |
                    ="Existing thread summary (if any): " & Coalesce(Global.followUpSummary, "None.") & Char(13) & Char(10) & "Latest question: " & Global.userQuestion & Char(13) & Char(10) & "Latest answer: " & Global.draftResponse

                - kind: ConditionGroup
                  id: conditionGroup_debug_followupSummary
                  conditions:
                    - id: conditionItem_debug_followupSummary
                      condition: =Global.debugMode = true
                      actions:
                        - kind: SendActivity
                          id: sendActivity_debug_followupSummary
                          activity: "DEBUG - Updated follow-up thread summary: {Global.followUpSummary}"

                - kind: SetVariable
                  id: clear_userQuestion_followup
                  variable: Global.userQuestion
                  value: =Blank()

                - kind: BeginDialog
                  id: goToAsk_followup
                  dialog: cidyrptc.topic.Cidy_Mini_RPTC

        - id: conditionItem_new
          condition: =Global.nextAction = "new"
          actions:
            - kind: SetVariable
              id: clear_followUpDepth_new
              variable: Global.followUpDepth
              value: 0

            - kind: SetVariable
              id: clear_followUpSummary_new
              variable: Global.followUpSummary
              value: =Blank()

            - kind: SetVariable
              id: clear_userQuestion_new
              variable: Global.userQuestion
              value: =Blank()

            - kind: BeginDialog
              id: goToAsk_new
              dialog: cidyrptc.topic.Cidy_Mini_RPTC

        - id: conditionItem_escalate
          condition: =Global.nextAction = "escalate"
          actions:
            - kind: BeginDialog
              id: goToEscalate
              dialog: cidyrptc.topic.Cidy_Mini_RPTC_Escalation

        - id: conditionItem_restart
          condition: =Global.nextAction = "restart"
          actions:
            - kind: BeginDialog
              id: goToRestart
              dialog: cidyrptc.topic.Cidy_Mini_RPTC_Restart

      elseActions:
        - kind: SendActivity
          id: sendActivity_fallback
          activity: I could not determine what you would like to do next. Let's try again.

        - kind: BeginDialog
          id: goToAsk_fallback
          dialog: cidyrptc.topic.Cidy_Mini_RPTC

inputType: {}
outputType: {}
