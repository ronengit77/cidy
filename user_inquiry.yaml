kind: AdaptiveDialog
modelDescription: This topic saves the user's response as a global variable.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  condition: true
  intent: {}
  actions:
    - kind: ConditionGroup
      id: conditionGroup_openCidyMode
      conditions:
        - id: conditionItem_openCidyMode
          condition: =Global.cidyMode = "open"
          actions:
            - kind: ConditionGroup
              id: conditionGroup_debug_openModeEntry
              conditions:
                - id: conditionItem_debug_openModeEntry
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_openModeEntry
                      activity: "DEBUG - User Inquiry open mode branch entered. Incoming text: {System.Activity.Text}"

            - kind: ConditionGroup
              id: conditionGroup_returnCommand_openMode
              conditions:
                - id: conditionItem_returnCommand_openMode
                  condition: =Or(Find("back to cidy flow", Lower(System.Activity.Text)) > 0, Find("back to cindy flow", Lower(System.Activity.Text)) > 0, Find("back to cidy", Lower(System.Activity.Text)) > 0, Find("back to cindy", Lower(System.Activity.Text)) > 0, Find("return to cidy flow", Lower(System.Activity.Text)) > 0, Find("return to cindy flow", Lower(System.Activity.Text)) > 0, Find("return to cidy", Lower(System.Activity.Text)) > 0, Find("return to cindy", Lower(System.Activity.Text)) > 0, Find("return to structured cidy flow", Lower(System.Activity.Text)) > 0, Find("return to structured cindy flow", Lower(System.Activity.Text)) > 0, Find("go back to cidy flow", Lower(System.Activity.Text)) > 0, Find("go back to cindy flow", Lower(System.Activity.Text)) > 0, Find("go back to controlled flow", Lower(System.Activity.Text)) > 0, Find("back to controlled flow", Lower(System.Activity.Text)) > 0, Find("back to flow", Lower(System.Activity.Text)) > 0)
                  actions:
                    - kind: SetVariable
                      id: set_cidyMode_structured_openMode
                      variable: Global.cidyMode
                      value: structured

                    - kind: SetVariable
                      id: clear_userQuestion_returnCommand_openMode
                      variable: Global.userQuestion
                      value: =Blank()

                    - kind: SetVariable
                      id: clear_transcript_returnCommand_openMode
                      variable: Global.transcript
                      value: =Blank()

                    - kind: SetVariable
                      id: clear_nextActionContext_returnCommand_openMode
                      variable: Global.nextActionContext
                      value: =Blank()

                    - kind: SendActivity
                      id: msg_returnToCidy_openMode
                      activity: |-
                        Hi, {System.User.FirstName}!

                        You are now back in Cidy's controlled flow.

                        **I'm Cidy (beta version), the UN DESA Capacity Development Assistant.**

                        My current knowledge areas include DA project planning/design and evaluation guidance; RPTC guidance and reports; Programme Development guidance, TAG meetings, Steering Committee materials, project evaluations, implementing partners and grants, Resident Coordinator country engagement, DESA capacity-development strategy, recommendations, and lessons learned; and general CDPMO knowledge. See the [Cidy knowledge map](https://ronengit77.github.io/cidy/documentation/cidy_response_topic_map.html).

                        I'll answer your questions using official documents and share source links and a confidence level for each response.

                        If I'm not confident that an answer is fully supported by available guidance, I'll let you know and help escalate your question to the appropriate team.

                        Ready to start chatting - type your inquiry below.
                        A good prompt will mention which funding stream and topic area your question is regarding (e.g., DA, RPTC, PDF/UNPDF, Programme Development, or general AND reporting, evaluation, governance, project design, TAG meetings, etc.)
                        Example prompt: *"When is a final evaluation required for a Development Account project?"*

                        You can say **"exit Cidy flow"** to continue in a more open conversation, and **"return to Cidy flow"** to come back to the controlled guidance path.

                    - kind: Question
                      id: question_returnCommand_openModeInput
                      interruptionPolicy:
                        allowInterruption: true

                      variable: Topic.newQuestion
                      prompt: Please type your question.
                      entity:
                        kind: StringPrebuiltEntity
                        sensitivityLevel: None

                    - kind: SetVariable
                      id: initialize_transcript_returnCommand_openMode
                      variable: Global.transcript
                      value: ="TRANSCRIPT" & Char(13) & Char(10) & Char(13) & Char(10)

                    - kind: SetVariable
                      id: set_globalQuestion_returnCommand_openMode
                      variable: Global.userQuestion
                      value: =Topic.newQuestion

                    - kind: SetVariable
                      id: log_newQuestion_returnCommand_openMode
                      variable: Global.transcript
                      value: "=Global.transcript & \"USER: \" & Topic.newQuestion & Char(13) & Char(10) & Char(13) & Char(10)"

                    - kind: BeginDialog
                      id: goToIntent_returnCommand_openMode
                      dialog: copilots_header_3141e.topic.Intent_c8W

                    - kind: EndDialog
                      id: end_returnCommand_openMode

            - kind: SetVariable
              id: capture_openModeQuestion
              variable: Global.userQuestion
              value: =System.Activity.Text

            - kind: SetVariable
              id: clear_openModeDraftResponse
              variable: Global.draftResponse
              value: =Blank()

            - kind: SetVariable
              id: clear_openModeFormattedAnswer
              variable: Global.formattedAnswer
              value: =Blank()

            - kind: SetVariable
              id: clear_openModeFormattedSources
              variable: Global.formattedSources
              value: =Blank()

            - kind: SetVariable
              id: clear_openModeConfidenceScore
              variable: Global.confidenceScore
              value: =Blank()

            - kind: SetVariable
              id: clear_openModeConfidenceLabel
              variable: Global.confidenceLabel
              value: =Blank()

            - kind: SetVariable
              id: clear_openModeWarningMessage
              variable: Global.warningMessage
              value: =Blank()

            - kind: SetVariable
              id: set_openModeSourceUseInstructions
              variable: Global.sourceUseInstructions
              value: Open Cidy chat mode. Search the broad top-level Knowledge source and answer naturally. Use approved Cidy knowledge where relevant. If the available Cidy knowledge does not support the answer, say so instead of inventing details.

            - kind: SetVariable
              id: log_openModeQuestion
              variable: Global.transcript
              value: |
                =Global.transcript & "USER: " & Global.userQuestion & Char(13) & Char(10) & Char(13) & Char(10)

            - kind: SearchAndSummarizeContent
              id: search_openCidyMode
              autoSend: false
              variable: Global.draftResponse
              userInput: |-
                ="User question: " & Global.userQuestion & Char(10) & Char(10) &
                "Binding source-use instructions: " & Global.sourceUseInstructions & Char(10) & Char(10) &
                "First identify the user's intent internally, then answer in a natural conversational style using approved Cidy knowledge where relevant. If the available Cidy knowledge does not contain enough reliable information, say so."
              additionalInstructions: |-
                You are Cidy, a UN DESA knowledge assistant. The user is outside the structured Cidy flow and is continuing in a more open conversation.
                Identify the user's intent internally before answering. Do not show a separate intent label unless it is helpful to the user.
                Search broadly across the provided Knowledge source. Do not force the user through structured classification or routing, but keep answers grounded in approved Cidy knowledge where relevant.
                If the user asks for latest, most recent, current, newest, updated, or similar, prioritize the most recent dated source available. State the source date, year, tranche, version, or meeting date used.
                For recency-sensitive questions, reduce CONFIDENCE if the best source found is older than expected, undated, or may not reflect the current state. Use CONFIDENCE 5 only when the answer is supported by a clearly dated current/latest source; use 2-3 for older or undated latest-available sources; use 0-1 if no reliable dated source is found.
                Format your response as follows:
                ANSWER: Your detailed answer
                SOURCES: List each source as a markdown link in this exact format: [name of file](full url). The text in brackets must be the file name or document title. The text in parentheses must be the full URL only, starting with http:// or https://. Do not put titles, descriptions, dates, or file names in parentheses. Do not reverse the markdown link order. If a full URL is not available, list the source title as plain text without brackets.
                CONFIDENCE: Write ONLY a single number from 0 to 5 on this line, nothing else. No explanation, no labels, no words such as uncertain. Just the number.
              fileSearchDataSource:
                searchFilesMode:
                  kind: DoNotSearchFiles

              knowledgeSources:
                kind: SearchSpecificKnowledgeSources
                knowledgeSources:
                  - copilots_header_3141e.topic.Knowledge_WYTpGldAWsk7o_B4cI6Vn

            - kind: BeginDialog
              id: goToAssessFromOpenMode
              dialog: copilots_header_3141e.topic.AssessConfidence

            - kind: EndDialog
              id: end_openCidyMode

    - kind: ConditionGroup
      id: conditionGroup_checkAwait
      conditions:
        - id: conditionItem_awaiting
          condition: =Global.awaitingNewQuestion = true
          actions:
            - kind: ConditionGroup
              id: conditionGroup_debug_awaitingNewQuestionEntry
              conditions:
                - id: conditionItem_debug_awaitingNewQuestionEntry
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_awaitingNewQuestionEntry
                      activity: "DEBUG - User Inquiry awaitingNewQuestion branch entered. Incoming text: {System.Activity.Text}"

            - kind: SetVariable
              id: clear_flag
              variable: Global.awaitingNewQuestion
              value: =false

            - kind: SetVariable
              id: capture_newQuestion
              variable: Global.userQuestion
              value: =System.Activity.Text

            - kind: ConditionGroup
              id: conditionGroup_exitCommand_awaitingNewQuestion
              conditions:
                - id: conditionItem_exitCommand_awaitingNewQuestion
                  condition: =Or(Find("exit cidy flow", Lower(Global.userQuestion)) > 0, Find("exit cindy flow", Lower(Global.userQuestion)) > 0, Find("exit structured cidy flow", Lower(Global.userQuestion)) > 0, Find("exit structured cindy flow", Lower(Global.userQuestion)) > 0, Find("leave cidy flow", Lower(Global.userQuestion)) > 0, Find("leave cindy flow", Lower(Global.userQuestion)) > 0, Find("leave structured flow", Lower(Global.userQuestion)) > 0, Find("stop cidy flow", Lower(Global.userQuestion)) > 0, Find("stop cindy flow", Lower(Global.userQuestion)) > 0, Find("leave controlled flow", Lower(Global.userQuestion)) > 0, Find("exit controlled flow", Lower(Global.userQuestion)) > 0, Find("switch to open chat", Lower(Global.userQuestion)) > 0, Find("open conversation", Lower(Global.userQuestion)) > 0, Find("switch to open conversation", Lower(Global.userQuestion)) > 0)
                  actions:
                    - kind: SetVariable
                      id: set_cidyMode_open_awaitingNewQuestion
                      variable: Global.cidyMode
                      value: open

                    - kind: SetVariable
                      id: clear_userQuestion_exit_awaitingNewQuestion
                      variable: Global.userQuestion
                      value: =Blank()

                    - kind: SendActivity
                      id: msg_exitCidyFlow_awaitingNewQuestion
                      activity: |-
                        You are now outside the structured Cidy flow. I can continue in a more open conversation, but I will still use approved Cidy knowledge where relevant.

                        You can say **"return to Cidy flow"** at any time to go back to the structured guidance path.

                    - kind: EndDialog
                      id: end_exitCommand_awaitingNewQuestion

            - kind: SetVariable
              id: log_newQuestion
              variable: Global.transcript
              value: "=Global.transcript & \"USER: \" & System.Activity.Text & Char(13) & Char(10) & Char(13) & Char(10)"

            - kind: ConditionGroup
              id: conditionGroup_debug_awaitingNewQuestionCaptured
              conditions:
                - id: conditionItem_debug_awaitingNewQuestionCaptured
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_awaitingNewQuestionCaptured
                      activity: "DEBUG - User Inquiry captured awaited question. Global.userQuestion: {Global.userQuestion} | awaitingNewQuestion cleared: {Global.awaitingNewQuestion}"

            - kind: InvokeAIBuilderModelAction
              id: invokeAIBuilderModelAction_classifyAwaitedGreeting
              input:
                binding:
                  UserQuestion: |
                    ="Classify whether the following user input is only a greeting or social opener for Cidy, a DESA capacity-development knowledge assistant." & Char(10) & Char(10) &
                    "Return ONLY valid JSON. Do not include markdown, prose, comments, or code fences." & Char(10) & Char(10) &
                    "Required JSON schema:" & Char(10) &
                    "{""isGreeting"":true,""reason"":""...""}" & Char(10) & Char(10) &
                    "Rules:" & Char(10) &
                    "1. Set isGreeting=true only when the input is just a greeting, salutation, thanks, or social opener, with no substantive knowledge question." & Char(10) &
                    "2. Recognize common greetings in multiple languages and international workplace usage, including short forms such as hi, hello, hey, good morning, good afternoon, good evening, bonjour, hola, buenos dias, guten tag, ciao, namaste, salam, salaam, marhaba, ni hao, and similar." & Char(10) &
                    "3. Set isGreeting=false when the input includes any substantive request, question, topic, document, funding stream, procedure, policy, or knowledge need, even if it starts with a greeting." & Char(10) &
                    "4. Examples with isGreeting=true: Hi; Hello Cidy; Good morning; Bonjour; Thanks; Thank you." & Char(10) &
                    "5. Examples with isGreeting=false: Hi, how do I design a DA concept note?; Good morning, what is RPTC?; Bonjour, explain DESA capacity development strategy." & Char(10) &
                    "6. If uncertain, set isGreeting=false so the user's input can continue to the normal intent classifier." & Char(10) & Char(10) &
                    "User input:" & Char(10) &
                    Global.userQuestion

              output:
                binding:
                  predictionOutput: Topic.greetingCheckResult

              aIModelId: 9ef6e25f-8234-4658-9c83-e711c57f7258

            - kind: SetVariable
              id: setVariable_greetingCheckTextAwaited
              variable: Topic.greetingCheckText
              value: =Text(Topic.greetingCheckResult.text)

            - kind: SetVariable
              id: setVariable_isGreetingTextAwaited
              variable: Topic.isGreetingText
              value: =IfError(Lower(Text(ParseJSON(Topic.greetingCheckText).isGreeting)), "false")

            - kind: ConditionGroup
              id: conditionGroup_debug_greetingCheckAwaited
              conditions:
                - id: conditionItem_debug_greetingCheckAwaited
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_greetingCheckAwaited
                      activity: "DEBUG - User Inquiry awaited greeting check: {Topic.greetingCheckText} | isGreeting: {Topic.isGreetingText}"

            - kind: ConditionGroup
              id: conditionGroup_routeAwaitedGreetingOrIntent
              conditions:
                - id: conditionItem_awaitedGreeting
                  condition: =Topic.isGreetingText = "true"
                  actions:
                    - kind: BeginDialog
                      id: goToGreetingFromAwaitedQuestion
                      dialog: copilots_header_3141e.topic.Greeting

              elseActions:
                - kind: BeginDialog
                  id: goToClassifyFromLoop
                  dialog: copilots_header_3141e.topic.Intent_c8W

            - kind: EndDialog
              id: end_afterLoop

    - kind: Question
      id: question_ZfhAtz
      interruptionPolicy:
        allowInterruption: true

      variable: Global.userQuestion
      prompt: "**Please describe what you are looking for:**"
      entity:
        kind: StringPrebuiltEntity
        sensitivityLevel: None

    - kind: SetVariable
      id: setVariable_yWRCNY
      variable: Global.transcript
      value: ="TRANSCRIPT" & Char(13) & Char(10) & Char(13) & Char(10)

    - kind: SetVariable
      id: setVariable_yWwTw0
      variable: Global.transcript
      value: "=Global.transcript & \"USER: \" & Global.userQuestion & Char(13) & Char(10) & Char(13) & Char(10)"

    - kind: ConditionGroup
      id: conditionGroup_exitCommand_initialQuestion
      conditions:
        - id: conditionItem_exitCommand_initialQuestion
          condition: =Or(Find("exit cidy flow", Lower(Global.userQuestion)) > 0, Find("exit cindy flow", Lower(Global.userQuestion)) > 0, Find("exit structured cidy flow", Lower(Global.userQuestion)) > 0, Find("exit structured cindy flow", Lower(Global.userQuestion)) > 0, Find("leave cidy flow", Lower(Global.userQuestion)) > 0, Find("leave cindy flow", Lower(Global.userQuestion)) > 0, Find("leave structured flow", Lower(Global.userQuestion)) > 0, Find("stop cidy flow", Lower(Global.userQuestion)) > 0, Find("stop cindy flow", Lower(Global.userQuestion)) > 0, Find("leave controlled flow", Lower(Global.userQuestion)) > 0, Find("exit controlled flow", Lower(Global.userQuestion)) > 0, Find("switch to open chat", Lower(Global.userQuestion)) > 0, Find("open conversation", Lower(Global.userQuestion)) > 0, Find("switch to open conversation", Lower(Global.userQuestion)) > 0)
          actions:
            - kind: SetVariable
              id: set_cidyMode_open_initialQuestion
              variable: Global.cidyMode
              value: open

            - kind: SetVariable
              id: clear_userQuestion_exit_initialQuestion
              variable: Global.userQuestion
              value: =Blank()

            - kind: SendActivity
              id: msg_exitCidyFlow_initialQuestion
              activity: |-
                You are now outside the structured Cidy flow. I can continue in a more open conversation, but I will still use approved Cidy knowledge where relevant.

                You can say **"return to Cidy flow"** at any time to go back to the structured guidance path.

            - kind: EndDialog
              id: end_exitCommand_initialQuestion

    - kind: InvokeAIBuilderModelAction
      id: invokeAIBuilderModelAction_classifyInitialGreeting
      input:
        binding:
          UserQuestion: |
            ="Classify whether the following user input is only a greeting or social opener for Cidy, a DESA capacity-development knowledge assistant." & Char(10) & Char(10) &
            "Return ONLY valid JSON. Do not include markdown, prose, comments, or code fences." & Char(10) & Char(10) &
            "Required JSON schema:" & Char(10) &
            "{""isGreeting"":true,""reason"":""...""}" & Char(10) & Char(10) &
            "Rules:" & Char(10) &
            "1. Set isGreeting=true only when the input is just a greeting, salutation, thanks, or social opener, with no substantive knowledge question." & Char(10) &
            "2. Recognize common greetings in multiple languages and international workplace usage, including short forms such as hi, hello, hey, good morning, good afternoon, good evening, bonjour, hola, buenos dias, guten tag, ciao, namaste, salam, salaam, marhaba, ni hao, and similar." & Char(10) &
            "3. Set isGreeting=false when the input includes any substantive request, question, topic, document, funding stream, procedure, policy, or knowledge need, even if it starts with a greeting." & Char(10) &
            "4. Examples with isGreeting=true: Hi; Hello Cidy; Good morning; Bonjour; Thanks; Thank you." & Char(10) &
            "5. Examples with isGreeting=false: Hi, how do I design a DA concept note?; Good morning, what is RPTC?; Bonjour, explain DESA capacity development strategy." & Char(10) &
            "6. If uncertain, set isGreeting=false so the user's input can continue to the normal intent classifier." & Char(10) & Char(10) &
            "User input:" & Char(10) &
            Global.userQuestion

      output:
        binding:
          predictionOutput: Topic.greetingCheckResult

      aIModelId: 9ef6e25f-8234-4658-9c83-e711c57f7258

    - kind: SetVariable
      id: setVariable_greetingCheckTextInitial
      variable: Topic.greetingCheckText
      value: =Text(Topic.greetingCheckResult.text)

    - kind: SetVariable
      id: setVariable_isGreetingTextInitial
      variable: Topic.isGreetingText
      value: =IfError(Lower(Text(ParseJSON(Topic.greetingCheckText).isGreeting)), "false")

    - kind: ConditionGroup
      id: conditionGroup_debug_greetingCheckInitial
      conditions:
        - id: conditionItem_debug_greetingCheckInitial
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_greetingCheckInitial
              activity: "DEBUG - User Inquiry initial greeting check: {Topic.greetingCheckText} | isGreeting: {Topic.isGreetingText}"

    - kind: ConditionGroup
      id: conditionGroup_routeInitialGreetingOrIntent
      conditions:
        - id: conditionItem_initialGreeting
          condition: =Topic.isGreetingText = "true"
          actions:
            - kind: BeginDialog
              id: goToGreetingFromInitialQuestion
              dialog: copilots_header_3141e.topic.Greeting

      elseActions:
        - kind: BeginDialog
          id: 8B1Pt0
          dialog: copilots_header_3141e.topic.Intent_c8W

inputType: {}
outputType: {}
