kind: AdaptiveDialog
modelDescription: Rescue topic that returns users to Cidy's controlled intake flow from any conversation path. Activated by phrases like 'return to cidy', 'back to cidy', 'back to flow' 'back to controlled flow'.
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Return to Cidy
    includeInOnSelectIntent: false
    triggerQueries:
      - Back to Cidy flow
      - Back to Cindy flow
      - back to Cidy
      - back to Cindy
      - return to Cidy flow
      - return to Cindy flow
      - return to Cidy
      - return to Cindy
      - return to structured Cidy flow
      - return to structured Cindy flow
      - go back to Cidy flow
      - go back to Cindy flow
      - go back to controlled flow
      - back to controlled flow
      - back to flow

  actions:
    - kind: ConditionGroup
      id: conditionGroup_debug_returnToCidyEntry
      conditions:
        - id: conditionItem_debug_returnToCidyEntry
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_returnToCidyEntry
              activity: "DEBUG - Return to Cidy entered. Incoming text: {System.Activity.Text} | Current userQuestion before reset: {Global.userQuestion}"

    - kind: SetVariable
      id: reset_userQuestion
      variable: Global.userQuestion
      value: =Blank()

    - kind: SetVariable
      id: reset_transcript
      variable: Global.transcript
      value: =Blank()

    - kind: SetVariable
      id: reset_intentJson
      variable: Global.intentJson
      value: "{}"

    - kind: SetVariable
      id: reset_intentReason
      variable: Global.intentReason
      value: =Blank()

    - kind: SetVariable
      id: reset_questionEnhancements
      variable: Global.executiveQuestionEnhancements
      value: =Blank()

    - kind: SetVariable
      id: reset_sourceUseInstructions
      variable: Global.sourceUseInstructions
      value: =Blank()

    - kind: SetVariable
      id: reset_countryDataEnhancedQuestion
      variable: Global.countryDataEnhancedQuestion
      value: =Blank()

    - kind: SetVariable
      id: reset_nextActionContext
      variable: Global.nextActionContext
      value: =Blank()

    - kind: SetVariable
      id: reset_awaitingNewQuestion
      variable: Global.awaitingNewQuestion
      value: =false

    - kind: SetVariable
      id: reset_intentStatus
      variable: Global.intentStatus
      value: needs_classification

    - kind: SetVariable
      id: reset_knowledgeDomain
      variable: Global.knowledgeDomain
      value: unclear

    - kind: SetVariable
      id: reset_fundingStream
      variable: Global.fundingStream
      value: UNCLEAR

    - kind: SetVariable
      id: reset_topicArea
      variable: Global.topicArea
      value: unclear

    - kind: SetVariable
      id: reset_requiresClarification
      variable: Global.requiresClarification
      value: No

    - kind: SetVariable
      id: reset_clarificationType
      variable: Global.clarificationType
      value: none

    - kind: SetVariable
      id: reset_clarificationQuestion
      variable: Global.clarificationQuestion
      value: =Blank()

    - kind: SetVariable
      id: reset_clarificationAnswer
      variable: Global.clarificationAnswer
      value: =Blank()

    - kind: SetVariable
      id: reset_normalizedClarificationAnswer
      variable: Global.normalizedClarificationAnswer
      value: =Blank()

    - kind: SetVariable
      id: reset_clarificationAttempts
      variable: Global.clarificationAttempts
      value: 0

    - kind: SetVariable
      id: reset_routingTarget
      variable: Global.routingTarget
      value: =Blank()

    - kind: SetVariable
      id: reset_draftResponse
      variable: Global.draftResponse
      value: =Blank()

    - kind: SetVariable
      id: reset_formattedAnswer
      variable: Global.formattedAnswer
      value: =Blank()

    - kind: SetVariable
      id: reset_formattedSources
      variable: Global.formattedSources
      value: =Blank()

    - kind: SetVariable
      id: reset_confidenceScore
      variable: Global.confidenceScore
      value: =Blank()

    - kind: SetVariable
      id: reset_confidenceLabel
      variable: Global.confidenceLabel
      value: =Blank()

    - kind: SetVariable
      id: reset_confidenceExplanation
      variable: Global.confidenceExplanation
      value: =Blank()

    - kind: SetVariable
      id: reset_warningMessage
      variable: Global.warningMessage
      value: =Blank()

    - kind: SetVariable
      id: reset_issueSummary
      variable: Global.issueSummary
      value: =Blank()

    - kind: SetVariable
      id: reset_userFeedback
      variable: Global.userFeedback
      value: =Blank()

    - kind: SetVariable
      id: reset_askAnother
      variable: Global.askAnother
      value: =Blank()

    - kind: SetVariable
      id: reset_retryMode
      variable: Global.retryMode
      value: =Blank()

    - kind: SetVariable
      id: set_cidyMode_structured
      variable: Global.cidyMode
      value: structured

    - kind: SendActivity
      id: msg_returnToCidy
      activity: |-
        Hi, {System.User.FirstName}!

        You are now back in Cidy's controlled flow.

        **I'm Cidy (beta version), the UN DESA Capacity Development Assistant.**

        My current knowledge areas include DA project planning/design and evaluation guidance; RPTC guidance and reports; Programme Development guidance, TAG meetings, Steering Committee materials, project evaluations, implementing partners and grants, Resident Coordinator country engagement, DESA capacity-development strategy, recommendations, and lessons learned; and general CDPMO knowledge. See the [Cidy knowledge map](https://ronengit77.github.io/cidy/documentation/cidy_response_topic_map.html).

        I'll answer your questions using official documents and share source links and a confidence level for each response.

        If I'm not confident that an answer is fully supported by available guidance, I'll let you know and help escalate your question to the appropriate team.

        Ready to start chatting - type your inquiry below.
        A good prompt will mention which funding stream and topic area your question is regarding (e.g., DA, RPTC, PDF/UNPDF, Programme Development, or general AND reporting, evaluation, governance, project design, TAG meetings, etc.)
        Example prompt: *"When is a final evaluation required for a Development Account project?"*

        You can say **"exit Cidy flow"** to continue in a more open conversation, and **"return to Cidy flow"** to come back to the controlled guidance path.

    - kind: ConditionGroup
      id: conditionGroup_debug_returnToCidyBeforeQuestion
      conditions:
        - id: conditionItem_debug_returnToCidyBeforeQuestion
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_returnToCidyBeforeQuestion
              activity: DEBUG - Return to Cidy reset complete. Prompting for a fresh controlled-flow question.

    - kind: Question
      id: question_returnToCidyInput
      interruptionPolicy:
        allowInterruption: true

      variable: Topic.newQuestion
      prompt: Please type your question.
      entity:
        kind: StringPrebuiltEntity
        sensitivityLevel: None

    - kind: ConditionGroup
      id: conditionGroup_exitCommand_returnToCidyInput
      conditions:
        - id: conditionItem_exitCommand_returnToCidyInput
          condition: =Or(Find("exit cidy flow", Lower(Topic.newQuestion)) > 0, Find("exit cindy flow", Lower(Topic.newQuestion)) > 0, Find("exit structured cidy flow", Lower(Topic.newQuestion)) > 0, Find("exit structured cindy flow", Lower(Topic.newQuestion)) > 0, Find("leave cidy flow", Lower(Topic.newQuestion)) > 0, Find("leave cindy flow", Lower(Topic.newQuestion)) > 0, Find("leave structured flow", Lower(Topic.newQuestion)) > 0, Find("stop cidy flow", Lower(Topic.newQuestion)) > 0, Find("stop cindy flow", Lower(Topic.newQuestion)) > 0, Find("leave controlled flow", Lower(Topic.newQuestion)) > 0, Find("exit controlled flow", Lower(Topic.newQuestion)) > 0, Find("switch to open chat", Lower(Topic.newQuestion)) > 0, Find("open conversation", Lower(Topic.newQuestion)) > 0, Find("switch to open conversation", Lower(Topic.newQuestion)) > 0)
          actions:
            - kind: SetVariable
              id: set_cidyMode_open_returnToCidyInput
              variable: Global.cidyMode
              value: open

            - kind: SendActivity
              id: msg_exitCidyFlow_returnToCidyInput
              activity: |-
                You are now outside the structured Cidy flow. I can continue in a more open conversation, but I will still use approved Cidy knowledge where relevant.

                You can say **"return to Cidy flow"** at any time to go back to the structured guidance path.

            - kind: EndDialog
              id: end_exitCommand_returnToCidyInput

    - kind: SetVariable
      id: initialize_transcript
      variable: Global.transcript
      value: ="TRANSCRIPT" & Char(13) & Char(10) & Char(13) & Char(10)

    - kind: SetVariable
      id: set_globalQuestion
      variable: Global.userQuestion
      value: =Topic.newQuestion

    - kind: SetVariable
      id: log_newQuestion
      variable: Global.transcript
      value: "=Global.transcript & \"USER: \" & Topic.newQuestion & Char(13) & Char(10) & Char(13) & Char(10)"

    - kind: ConditionGroup
      id: conditionGroup_debug_returnToCidyCaptured
      conditions:
        - id: conditionItem_debug_returnToCidyCaptured
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_returnToCidyCaptured
              activity: "DEBUG - Return to Cidy captured fresh question and is routing to Intent. Global.userQuestion: {Global.userQuestion}"

    - kind: BeginDialog
      id: goToIntent
      dialog: copilots_header_3141e.topic.Intent_c8W

    - kind: EndDialog
      id: end_returnToCidy

inputType: {}
outputType: {}
