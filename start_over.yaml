kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Start Over
    includeInOnSelectIntent: false
    triggerQueries:
      - let's begin again
      - start over
      - start again
      - restart

  actions:
    - kind: ConditionGroup
      id: conditionGroup_debug_startOverEntry
      conditions:
        - id: conditionItem_debug_startOverEntry
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_startOverEntry
              activity: "DEBUG - Start Over topic entered. Incoming text: {System.Activity.Text}"

    - kind: Question
      id: question_zguoVV
      alwaysPrompt: false
      variable: init:Topic.Confirm
      prompt: Are you sure you want to restart the conversation?
      entity: BooleanPrebuiltEntity

    - kind: ConditionGroup
      id: conditionGroup_lvx2zV
      conditions:
        - id: conditionItem_sVQtHa
          condition: =Topic.Confirm = true
          actions:
            - kind: ConditionGroup
              id: conditionGroup_debug_startOverConfirmed
              conditions:
                - id: conditionItem_debug_startOverConfirmed
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_startOverConfirmed
                      activity: "DEBUG - Start Over confirmed. Routing to ResetConversation."

            - kind: BeginDialog
              id: 0YKYsy
              dialog: copilots_header_3141e.topic.ResetConversation

      elseActions:
        - kind: ConditionGroup
          id: conditionGroup_debug_startOverCancelled
          conditions:
            - id: conditionItem_debug_startOverCancelled
              condition: =Global.testMode = true
              actions:
                - kind: SendActivity
                  id: sendActivity_debug_startOverCancelled
                  activity: "DEBUG - Start Over cancelled by user."

        - kind: SendActivity
          id: sendMessage_lk2CyQ
          activity: Ok. Let's carry on.
