        - id: conditionItem_countryData
          condition: =Global.topicArea = "country_data"
          actions:
            - kind: SetVariable
              id: setVariable_countryDataInstructions
              variable: Global.sourceUseInstructions
              value: |-
                Use the Country Data knowledge source for country-level and region-level records about countries, regions, projects, requests, proposals, activities, travel, contacts, target groups, years, statuses, budgets, divisions, and LDC/LLDC/SIDS status.
                For broad or vague country/region questions such as list work in Fiji, what is happening in Fiji, show work in the Pacific, or what do we have for SIDS, interpret work broadly as projects, requests, proposals, activities, travel records, contacts, budgets, statuses, divisions, and summary metrics.
                Do not treat vague country or region wording as insufficient by itself. Expand retrieval with country/region anchors before searching.
                Prefer country-specific records, region-specific records, country-card files, compact country filenames, headings, tables, explicit counts, and summaries.
                Answer from explicit source content. If a category has zero records, include it as zero when supported. If only partial information is available, answer with what is available and state the limitation.

            - kind: SetVariable
              id: setVariable_countryDataEnhancedQuestion
              variable: Global.countryDataEnhancedQuestion
              value: =Trim(If(!IsBlank(Text(ParseJSON(Global.executiveQuestionEnhancements).detected_country_iso3)), Text(ParseJSON(Global.executiveQuestionEnhancements).detected_country_iso3), Global.userQuestion) & " country card country record compact country file region subregion ISO3 lowercase ISO3 projects requests proposals RPTC proposals activities RPTC activities travel contacts budgets statuses divisions current ongoing active planned completed closed SIDS LDC LLDC source file")

            - kind: ConditionGroup
              id: debug_countryDataGenerateAnswerInput
              conditions:
                - id: debug_countryDataGenerateAnswerInput_enabled
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: debug_countryDataGenerateAnswerInput_message
                      activity: |-
                        DEBUG - Programme Development country_data generate answer card input

                        Global.userQuestion:
                        {Global.userQuestion}

                        Global.sourceUseInstructions:
                        {Global.sourceUseInstructions}

                        userInput sent to SearchAndSummarizeContent:
                        {Global.countryDataEnhancedQuestion}

                        Global.countryDataEnhancedQuestion:
                        {Global.countryDataEnhancedQuestion}

                        ---------------------------------
                        additionalInstructions sent to SearchAndSummarizeContent:
                        Answer using ONLY the selected Country Data knowledge source.

                        Use the enhanced retrieval query. It intentionally starts with the detected country, region, grouping, and retrieval anchors because short phrases like "list work in Fiji" are too vague for reliable retrieval.

                        For country or region work queries, interpret "work" broadly as:
                        projects, requests, proposals, RPTC proposals, activities, RPTC activities, travel records, contacts, budgets, statuses, divisions, current/ongoing/active records, completed/closed records, and summary metrics.

                        Prefer country-specific records, region-specific records, compact country filenames, country-card files, headings, tables, explicit counts, and summary sections.

                        Use country name, region name, ISO3, lowercase ISO3, and compact filename patterns as retrieval clues only. Answer from explicit source content.

                        If the source gives counts, include them. If a category has zero records, include it as zero. If details are missing or unclear, answer with the available information and state the limitation.

                        Format:
                        ANSWER:
                        SOURCES:
                        CONFIDENCE:

                        knowledgeSources:
                        copilots_header_3141e.topic.CidyCountryData_VUhURDqxKRX3LM0Lx4RKy

            - kind: SearchAndSummarizeContent
              id: search_countryData
              autoSend: false
              variable: Global.draftResponse
              userInput: =Global.countryDataEnhancedQuestion
              additionalInstructions: |-
                Answer using ONLY the selected Country Data knowledge source.

                Use the enhanced retrieval query. It intentionally starts with the detected country, region, grouping, and retrieval anchors because short phrases like "list work in Fiji" are too vague for reliable retrieval.

                For country or region work queries, interpret "work" broadly as:
                projects, requests, proposals, RPTC proposals, activities, RPTC activities, travel records, contacts, budgets, statuses, divisions, current/ongoing/active records, completed/closed records, and summary metrics.

                Prefer country-specific records, region-specific records, compact country filenames, country-card files, headings, tables, explicit counts, and summary sections.

                Use country name, region name, ISO3, lowercase ISO3, and compact filename patterns as retrieval clues only. Answer from explicit source content.

                If the source gives counts, include them. If a category has zero records, include it as zero. If details are missing or unclear, answer with the available information and state the limitation.

                Format:
                ANSWER:
                SOURCES:
                CONFIDENCE:
              fileSearchDataSource:
