kind: AdaptiveDialog
modelDescription: This topic searches the full RPTC knowledge base for any RPTC-related question and generates a draft response with confidence score. It does not display the answer to the user.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: SetVariable
      id: setSourceUseInstructions_rptcAll
      variable: Global.sourceUseInstructions
      value: "This knowledge source contains all RPTC documents across two categories: (1) RPTC progress reports covering achievements, countries and entities supported, interventions, requests, people supported, results by SIDS/LDC/LLDC, challenges, and recommendations for strengthening RPTC; and (2) RPTC guidance and templates covering planning, approving, implementing, and reporting RPTC activities, including the activity proposal template, common reporting standards, IRA recruitment and administration guidance, activity report template, and broader RPTC guidelines."

    - kind: SearchAndSummarizeContent
      id: search_rptcAll
      autoSend: false
      variable: Global.draftResponse
      userInput: |-
        ="User question: " & Global.userQuestion & Char(10) & Char(10) &
        "Question enhancements: " & Global.executiveQuestionEnhancements
      additionalInstructions: |-
        You are Cidy, a UN DESA knowledge assistant. The user is asking about the Regular Programme of Technical Cooperation (RPTC), topic area: {Global.topicArea}.
        Answer the question using ONLY the provided RPTC knowledge sources.
        Source-use instructions: {Global.sourceUseInstructions}
        For progress report questions (achievements, results, countries supported, requests, interventions, people supported, implementing entities, SIDS/LDC/LLDC support, challenges, recommendations): draw from the RPTC progress reports.
        For guidance and template questions (planning, approval, implementation, reporting, proposals, standards, IRA, templates, governance, roles, design): draw from the RPTC guidance and templates documents.
        If the knowledge source does not contain enough reliable information, say so.
        If the user asks for latest, most recent, current, newest, updated, or similar, prioritize the most recent dated source available. State the source date, year, report year, or version used.
        For count questions, count matching records or reported figures from the knowledge source where possible. If the source only supports an approximate count, state that limitation clearly.
        For recency-sensitive questions, reduce CONFIDENCE if the best source found is older than expected, undated, or may not reflect the current state. Use CONFIDENCE 5 only when the answer is supported by a clearly dated current/latest source; use 2-3 for older or undated latest-available sources; use 0-1 if no reliable dated source is found.
        Format your response as follows:
        ANSWER: Your detailed answer
        SOURCES: List each source as a markdown link in this exact format: [name of file](full url). The text in brackets must be the file name or document title. The text in parentheses must be the full URL only, starting with http:// or https://. Do not put titles, descriptions, dates, or file names in parentheses. Do not reverse the markdown link order. If a full URL is not available, list the source title as plain text without brackets.
        CONFIDENCE: Write ONLY a single number from 0 to 5 on this line, nothing else. No explanation, no asterisks, no additional text. Just the number.
      fileSearchDataSource:
        searchFilesMode:
          kind: DoNotSearchFiles

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources
        knowledgeSources:
          - copilots_header_3141e.topic.RPTCFileUpload_vV7zz8x3_EXkXTX80LY34

    - kind: SetVariable
      id: set_responseTimeSeconds
      variable: Global.responseTimeSeconds
      value: =If(IsBlank(Global.requestStartTime), -1, DateDiff(Global.requestStartTime, Now(), TimeUnit.Seconds))

    - kind: ConditionGroup
      id: conditionGroup_debug_responseTime
      conditions:
        - id: conditionItem_debug_responseTime
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_responseTime
              activity: "DEBUG - Response time: {Global.responseTimeSeconds}s | Funding stream: {Global.fundingStream} | Topic area: {Global.topicArea} | Result: {If(IsBlank(Global.draftResponse), \"BLANK\", \"HAS CONTENT\")}"

    - kind: BeginDialog
      id: goToAssess
      dialog: copilots_header_3141e.topic.AssessConfidence

inputType: {}
outputType: {}
