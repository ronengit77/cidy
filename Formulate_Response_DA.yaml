kind: AdaptiveDialog
modelDescription: TEST COPY of Formulate_Response_DA. Identical to production except for the project_planning_design userInput suffix (updated from Testing_DA_PPD). Do not push to production until validated.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: ConditionGroup
      id: conditionGroup_rsyEfm
      conditions:
        - id: conditionItem_mMA5gI
          condition: =Global.topicArea = "project_planning_design"
          actions:
            - kind: SetTextVariable
              id: uajO8c
              variable: Global.sourceUseInstructions
              value: The Project Planning and Design folder is organized by tranche. Use the highest tranche number as the most recent unless the user explicitly asks for an earlier tranche. Prefer Concept Note Guidelines for concept note questions and Project Document Guidelines for project document questions. Do not use blank templates unless the user specifically asks for templates. Use Excel annexes for annex-table questions together with Project Document Guidelines. Use review checklists only for QA/QC, internal review, or pre-submission review questions.

            - kind: SetVariable
              id: set_ppdRetrievalQuestion
              variable: Topic.ppdRetrievalQuestion
              value: =Global.userQuestion & " Development Account DA concept note CN project document PD guidelines template Excel annex review checklist tranche T19 T18 T17 T16 T15 T14 latest most recent project planning design requirements sections objectives budget results framework quality assurance internal review submission implementing entity"

            - kind: ConditionGroup
              id: conditionGroup_debug_ppd_start
              conditions:
                - id: conditionItem_debug_ppd_start
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_ppd_start
                      activity: |-
                        DEBUG - DA TEST Project Planning and Design branch entered.

                        Incoming text:
                        {System.Activity.Text}

                        User question (Global):
                        {Global.userQuestion}

                        Topic area:
                        {Global.topicArea}

                        Expanded retrieval question:
                        {Topic.ppdRetrievalQuestion}

                        Knowledge source under test:
                        copilots_header_3141e.topic.CidyDAProjectPlanningandDesign_oy_jlk_uCuNf2iko9HdJK

                        Test plan:
                        Pass 1 - Specific PPD knowledge source with expanded query.
                        Pass 2 - Broad DA knowledge source if Pass 1 is blank.

            - kind: SearchAndSummarizeContent
              id: iWuL74
              autoSend: false
              variable: Global.draftResponse
              userInput: =Topic.ppdRetrievalQuestion
              additionalInstructions: |-
                You are Cidy, a UN DESA knowledge assistant. The user is asking about the Development Account (DA) funding stream, topic area: {Global.topicArea}.
                Answer the question using ONLY the provided DA knowledge sources.
                Source-use instructions: {Global.sourceUseInstructions}
                If the knowledge source does not contain enough reliable information, say so.
                If the user asks for latest, most recent, current, newest, updated, or similar, prioritize the most recent dated source available. State the source date, year, tranche, version, or meeting date used.
                For recency-sensitive questions, reduce CONFIDENCE if the best source found is older than expected, undated, or may not reflect the current state. Use CONFIDENCE 5 only when the answer is supported by a clearly dated current/latest source; use 2-3 for older or undated latest-available sources; use 0-1 if no reliable dated source is found.
                Format your response as follows:
                ANSWER: Your detailed answer
                SOURCES: List each source as a markdown link in this exact format: [name of file](full url). The text in brackets must be the file name or document title. The text in parentheses must be the full URL only, starting with http:// or https://. Do not put titles, descriptions, dates, or file names in parentheses. Do not reverse the markdown link order. If a full URL is not available, list the source title as plain text without brackets.
                CONFIDENCE: Write ONLY a single number from 0 to 5 on this line, nothing else. No explanation, no asterisks, no additional text. Just the number.
              fileSearchDataSource:
                searchFilesMode:
                  kind: DoNotSearchFiles

              knowledgeSources:
                kind: SearchSpecificKnowledgeSources
                knowledgeSources:
                  - copilots_header_3141e.topic.CidyDAProjectPlanningandDesign_oy_jlk_uCuNf2iko9HdJK

            - kind: ConditionGroup
              id: conditionGroup_debug_ppd_postSearch
              conditions:
                - id: conditionItem_debug_ppd_postSearch
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_ppd_postSearch
                      activity: |-
                        DEBUG - Pass 1 result: Specific PPD knowledge source

                        Query sent:
                        {Topic.ppdRetrievalQuestion}

                        Response:
                        {Global.draftResponse}

        - id: conditionItem_O9CKVo
          condition: =Global.topicArea = "evaluation_design"
          actions:
            - kind: SetTextVariable
              id: 7XENFr
              variable: Global.sourceUseInstructions
              value: |-
                Use the Evaluation knowledge folder.

                When a document is tranche-labeled, use the highest tranche number unless the user explicitly asks about an earlier tranche.

                Use non-tranche general evaluation documents where they apply across tranches.

                Use guidance notes and annotated templates as primary sources for substantive answers.

                Do not use unannotated templates unless the user specifically asks for a blank template or template structure.

                The DA guidance note on terminal evaluation of joint projects v1 is relevant from T12 onward.

                The DA project evaluation report template 02-2026 and DA suggested management response template 02-2026 are relevant from T15 onward.

            - kind: SearchAndSummarizeContent
              id: NWnG1Y
              autoSend: false
              variable: Global.draftResponse
              userInput: |-
                ="User question: " & Global.userQuestion & Char(10) & Char(10) &
                "Question enhancements: " & Global.executiveQuestionEnhancements
              additionalInstructions: |-
                You are Cidy, a UN DESA knowledge assistant. The user is asking about the Development Account (DA) funding stream, topic area: {Global.topicArea}.
                Answer the question using ONLY the provided DA knowledge sources.
                Source-use instructions: {Global.sourceUseInstructions}
                If the knowledge source does not contain enough reliable information, say so.
                If the user asks for latest, most recent, current, newest, updated, or similar, prioritize the most recent dated source available. State the source date, year, tranche, version, or meeting date used.
                For recency-sensitive questions, reduce CONFIDENCE if the best source found is older than expected, undated, or may not reflect the current state. Use CONFIDENCE 5 only when the answer is supported by a clearly dated current/latest source; use 2-3 for older or undated latest-available sources; use 0-1 if no reliable dated source is found.
                Format your response as follows:
                ANSWER: Your detailed answer
                SOURCES: List each source as a markdown link in this exact format: [name of file](full url). The text in brackets must be the file name or document title. The text in parentheses must be the full URL only, starting with http:// or https://. Do not put titles, descriptions, dates, or file names in parentheses. Do not reverse the markdown link order. If a full URL is not available, list the source title as plain text without brackets.
                CONFIDENCE: Write ONLY a single number from 0 to 5 on this line, nothing else. No explanation, no asterisks, no additional text. Just the number.
              fileSearchDataSource:
                searchFilesMode:
                  kind: DoNotSearchFiles

              knowledgeSources:
                kind: SearchSpecificKnowledgeSources
                knowledgeSources:
                  - copilots_header_3141e.topic.Evaluations_zeK4BT8uZXrgHEy5vAivo

        - id: conditionItem_PGrWf8
          condition: =Global.topicArea = "general"
          actions:
            - kind: SetVariable
              id: setVariable_fypWUT
              variable: Global.sourceUseInstructions
              value: The general folder is organized by tranche. Use the highest tranche number as the most recent unless the user explicitly asks for an earlier tranche. Prefer Concept Note Guidelines for concept note questions and Project Document Guidelines for project document questions. Do not use blank templates unless the user specifically asks for templates. Use Excel annexes for annex-table questions together with Project Document Guidelines. Use review checklists only for QA/QC, internal review, or pre-submission review questions.

            - kind: SearchAndSummarizeContent
              id: 8dFb9P
              autoSend: false
              variable: Global.draftResponse
              userInput: |-
                ="User question: " & Global.userQuestion & Char(10) & Char(10) &
                "Question enhancements: " & Global.executiveQuestionEnhancements
              additionalInstructions: |-
                You are Cidy, a UN DESA knowledge assistant. The user is asking about the Development Account (DA) funding stream, topic area: {Global.topicArea}.
                Answer the question using ONLY the provided DA knowledge sources.
                Source-use instructions: {Global.sourceUseInstructions}
                If the knowledge source does not contain enough reliable information, say so.
                If the user asks for latest, most recent, current, newest, updated, or similar, prioritize the most recent dated source available. State the source date, year, tranche, version, or meeting date used.
                For recency-sensitive questions, reduce CONFIDENCE if the best source found is older than expected, undated, or may not reflect the current state. Use CONFIDENCE 5 only when the answer is supported by a clearly dated current/latest source; use 2-3 for older or undated latest-available sources; use 0-1 if no reliable dated source is found.
                Format your response as follows:
                ANSWER: Your detailed answer
                SOURCES: List each source as a markdown link in this exact format: [name of file](full url). The text in brackets must be the file name or document title. The text in parentheses must be the full URL only, starting with http:// or https://. Do not put titles, descriptions, dates, or file names in parentheses. Do not reverse the markdown link order. If a full URL is not available, list the source title as plain text without brackets.
                CONFIDENCE: Write ONLY a single number from 0 to 5 on this line, nothing else. No explanation, no asterisks, no additional text. Just the number.
              fileSearchDataSource:
                searchFilesMode:
                  kind: DoNotSearchFiles

              knowledgeSources:
                kind: SearchSpecificKnowledgeSources
                knowledgeSources:
                  - copilots_header_3141e.topic.CidyDAProjectPlanningandDesign_oy_jlk_uCuNf2iko9HdJK

      elseActions:
        - kind: SetVariable
          id: setSourceUseInstructions_DA_elseActions
          variable: Global.sourceUseInstructions
          value: Search the general DA knowledge base for the most relevant answer to this Development Account question.

        - kind: SearchAndSummarizeContent
          id: J7vEWX
          autoSend: false
          variable: Global.draftResponse
          userInput: |-
            ="User question: " & Global.userQuestion & Char(10) & Char(10) &
            "Question enhancements: " & Global.executiveQuestionEnhancements
          additionalInstructions: |-
            You are Cidy, a UN DESA knowledge assistant. The user is asking about the Development Account (DA) funding stream, topic area: {Global.topicArea}.
            Answer the question using ONLY the provided DA knowledge sources.
            If the user asks for latest, most recent, current, newest, updated, or similar, prioritize the most recent dated source available. State the source date, year, tranche, version, or meeting date used.
            For recency-sensitive questions, reduce CONFIDENCE if the best source found is older than expected, undated, or may not reflect the current state. Use CONFIDENCE 5 only when the answer is supported by a clearly dated current/latest source; use 2-3 for older or undated latest-available sources; use 0-1 if no reliable dated source is found.
            Format your response as follows:
            ANSWER: Your detailed answer
            SOURCES: List each source as a markdown link in this exact format: [name of file](full url). The text in brackets must be the file name or document title. The text in parentheses must be the full URL only, starting with http:// or https://. Do not put titles, descriptions, dates, or file names in parentheses. Do not reverse the markdown link order. If a full URL is not available, list the source title as plain text without brackets.
            CONFIDENCE: Write ONLY a single number from 0 to 5 on this line, nothing else. No explanation, no asterisks, no additional text. Just the number.
          fileSearchDataSource:
            searchFilesMode:
              kind: DoNotSearchFiles

          knowledgeSources:
            kind: SearchSpecificKnowledgeSources
            knowledgeSources:
              - copilots_header_3141e.topic.CidyDAAll_fNqeT7A_zZXF76sp_dprZ

    - kind: ConditionGroup
      id: conditionGroup_fallback
      conditions:
        - id: conditionItem_noResult
          condition: =IsBlank(Global.draftResponse)
          actions:
            - kind: SetVariable
              id: setSourceUseInstructions_DA_fallback
              variable: Global.sourceUseInstructions
              value: The specific DA knowledge folder did not return a result. Search the general DA knowledge base for the most relevant answer.

            - kind: SearchAndSummarizeContent
              id: search_DA_fallback
              autoSend: false
              variable: Global.draftResponse
              userInput: |-
                ="User question: " & Global.userQuestion & Char(10) & Char(10) &
                "Question enhancements: " & Global.executiveQuestionEnhancements
              additionalInstructions: |-
                You are Cidy, a UN DESA knowledge assistant. The user is asking about the Development Account (DA) funding stream, topic area: {Global.topicArea}.
                The specific knowledge folder did not contain a relevant answer. Search the general DA knowledge base.
                Answer the question using ONLY the provided DA knowledge sources.
                Source-use instructions: {Global.sourceUseInstructions}
                If the knowledge source does not contain enough reliable information, say so.
                If the user asks for latest, most recent, current, newest, updated, or similar, prioritize the most recent dated source available. State the source date, year, tranche, version, or meeting date used.
                For recency-sensitive questions, reduce CONFIDENCE if the best source found is older than expected, undated, or may not reflect the current state. Use CONFIDENCE 5 only when the answer is supported by a clearly dated current/latest source; use 2-3 for older or undated latest-available sources; use 0-1 if no reliable dated source is found.
                Format your response as follows:
                ANSWER: Your detailed answer
                SOURCES: List each source as a markdown link in this exact format: [name of file](full url). The text in brackets must be the file name or document title. The text in parentheses must be the full URL only, starting with http:// or https://. Do not put titles, descriptions, dates, or file names in parentheses. Do not reverse the markdown link order. If a full URL is not available, list the source title as plain text without brackets.
                CONFIDENCE: Write ONLY a single number from 0 to 5 on this line, nothing else. No explanation, no asterisks, no additional text. Just the number.
              fileSearchDataSource:
                searchFilesMode:
                  kind: DoNotSearchFiles

              knowledgeSources:
                kind: SearchSpecificKnowledgeSources
                knowledgeSources:
                  - copilots_header_3141e.topic.CidyDAAll_fNqeT7A_zZXF76sp_dprZ

            - kind: ConditionGroup
              id: conditionGroup_debug_da_fallback_postSearch
              conditions:
                - id: conditionItem_debug_da_fallback_postSearch
                  condition: =Global.testMode = true
                  actions:
                    - kind: SendActivity
                      id: sendActivity_debug_da_fallback_postSearch
                      activity: |-
                        DEBUG - Pass 2 result: Broad DA source (Pass 1 was blank)

                        Query sent:
                        {Topic.ppdRetrievalQuestion}

                        Response:
                        {Global.draftResponse}

    - kind: SetVariable
      id: set_responseTimeSeconds
      variable: Global.responseTimeSeconds
      value: =DateDiff(Global.requestStartTime, Now(), TimeUnit.Seconds)

    - kind: ConditionGroup
      id: conditionGroup_debug_responseTime
      conditions:
        - id: conditionItem_debug_responseTime
          condition: =Global.testMode = true
          actions:
            - kind: SendActivity
              id: sendActivity_debug_responseTime
              activity: "DEBUG - Response time: {Global.responseTimeSeconds}s | Funding stream: {Global.fundingStream} | Topic area: {Global.topicArea} | Result: {If(IsBlank(Global.draftResponse), \"BLANK\", \"HAS CONTENT\")}"

    - kind: BeginDialog
      id: goToAssess
      dialog: copilots_header_3141e.topic.AssessConfidence

inputType: {}
outputType: {}
